title = "Public test fixture exceptions"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public fake API key used only to verify sensitive log redaction."
condition = "AND"
regexTarget = "line"
paths = ['''^sky-take-out/sky-server/src/test/java/com/sky/observability/SensitiveLoggingTest\.java$''']
regexes = ['''^\n?        String input = "password=" \+ canary \+ " token=Bearer abc\.def\.ghi apiKey=sk-live-123456 "\r?$''']

[[rules.allowlists]]
description = "Public deterministic AES key used only by the payment callback test fixture."
condition = "AND"
regexTarget = "line"
paths = ['''^sky-take-out/sky-server/src/test/java/com/sky/payment/CallbackCryptoFixture\.java$''']
regexes = ['''^\n?    static final String AES_KEY = "0123456789abcdef0123456789abcdef";\r?$''']

