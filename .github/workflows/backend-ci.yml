name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Verify backend
        run: mvn -B -f sky-take-out/pom.xml verify

      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports-${{ github.sha }}
          if-no-files-found: warn
          path: |
            sky-take-out/**/target/surefire-reports/**
            sky-take-out/**/target/failsafe-reports/**
            sky-take-out/**/target/site/jacoco/**

      - name: Upload verified backend artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: sky-server-${{ github.sha }}
          path: sky-take-out/sky-server/target/*.jar
